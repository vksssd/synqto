name: Extension & Website CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─── 1. Build & Package Chrome Extension ───
  extension-ci:
    name: Chrome Extension Build & Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build React Sidepanel & Background (Vite)
        run: npm run build

      - name: Bundle Content Script & Package Release
        run: |
          node scripts/build-content.mjs
          node scripts/package.mjs

      - name: Upload Extension Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: synqto-chrome-extension
          path: extension/dist-zip/synqto-v*.zip
          retention-days: 30
