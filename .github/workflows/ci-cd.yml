name: CI/CD Pipeline & Extension Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─── 1. Build & Test Go Signaling Server ───
  server-ci:
    name: Go Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Run Unit & Integration Tests
        run: go test -v ./...

      - name: Build Production Static Binary
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/server .

      - name: Verify Docker Container Build
        run: docker build -t nerd-buddy-server .

  # ─── 2. Build & Package Chrome Extension ───
  extension-ci:
    name: Chrome Extension CI & Packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension Bundle (Vite)
        run: npm run build

      - name: Package Chrome Web Store ZIP
        run: |
          mkdir -p dist-zip
          zip -r dist-zip/nerd-buddy-extension.zip dist/

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nerd-buddy-chrome-extension
          path: extension/dist-zip/nerd-buddy-extension.zip
          retention-days: 30

  # ─── 3. Deploy Go Server to Fly.io (If Secret Configured) ───
  deploy-server:
    name: Deploy to Cloud (Fly.io)
    needs: [server-ci, extension-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Server to Fly.io
        if: env.FLY_API_TOKEN != ''
        working-directory: server
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
